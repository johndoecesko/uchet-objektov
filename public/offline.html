<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Нет связи — Учёт объектов</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; }
  .card { max-width: 340px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #4b5563; line-height: 1.45; margin: 0 0 20px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; width: 100%; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Нет связи</h1>
    <p>Учёт работает только с интернетом. Проверьте связь и попробуйте ещё раз — ничего из уже сохранённого не потеряно.</p>
    <button onclick="location.reload()">Обновить</button>
  </div>
</body>
</html>
